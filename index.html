<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Reading Tracker</h1>
  </header>

  <main>
    <section id="tab-heatmap" class="tab">
      <h2>Heatmap</h2>
      <p class="placeholder">Your monthly reading heatmap will appear here.</p>
    </section>

    <section id="tab-log" class="tab" hidden>
      <h2>Log pages</h2>
      <p class="placeholder">The form to log pages read will appear here.</p>
    </section>

    <section id="tab-books" class="tab" hidden>
      <h2>Books</h2>

      <form id="book-form" class="card">
        <h3 id="book-form-heading">Add a book</h3>
        <label>Title
          <input name="title" required pattern=".*\S.*" title="Please enter a title">
        </label>
        <label>Author
          <input name="author">
        </label>
        <label>Total pages
          <input name="totalPages" type="number" min="1" step="1" inputmode="numeric" required>
        </label>
        <div class="form-actions">
          <button type="submit" class="primary" id="book-submit">Add book</button>
          <button type="button" id="book-cancel" hidden>Cancel</button>
        </div>
      </form>

      <p id="books-empty" class="placeholder">No books yet. Add your first book above.</p>
      <ul id="book-list" class="book-list"></ul>
    </section>
  </main>

  <nav class="tab-bar">
    <button data-tab="heatmap">Heatmap</button>
    <button data-tab="log">Log</button>
    <button data-tab="books">Books</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
